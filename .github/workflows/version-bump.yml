name: Version Bump

on:
  workflow_dispatch:

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Check for pending changesets
        id: check
        run: |
          if find .changeset -name "*.md" ! -name "README.md" | grep -q .; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        if: steps.check.outputs.has_changesets == 'true'
        run: pnpm version

      - name: Get new version
        if: steps.check.outputs.has_changesets == 'true'
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v${{ steps.pkg.outputs.version }}"
          git push

      - name: No changesets found
        if: steps.check.outputs.has_changesets == 'false'
        run: echo "No pending changesets found. Nothing to bump."
